name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build application
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Build application
        shell: pwsh
        run: msbuild SimpleX.csproj /target:Rebuild /property:Configuration=Debug /property:Platform=x86 /m
